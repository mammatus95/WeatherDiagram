name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '00 00 20 * *'
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Match the version configured in your pom.xml
          cache: maven

      - name: Build and test
        run: mvn --batch-mode verify
